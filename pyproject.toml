[build-system]
requires = ["hatchling==1.32.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "librepcb-mcp-server"
version = "0.1.0.dev5"
description = "Local inspection, checks, exports and experimental resistance candidates for LibrePCB 2.1.1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.2.0"]

[project.scripts]
librepcb-mcp = "librepcb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/librepcb_mcp"]
